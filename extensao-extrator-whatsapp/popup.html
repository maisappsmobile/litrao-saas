<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Litrão do Reset - Extrator WhatsApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 380px;
      background: #090D16;
      color: #F1F5F9;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1E293B;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .logo-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #10B981, #059669);
      color: white;
      font-weight: 900;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
    }
    .subtitle {
      font-size: 10px;
      color: #94A3B8;
    }
    .status-card {
      background: #111827;
      border: 1px solid #1F2937;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
    }
    .dot.active {
      background: #10B981;
      box-shadow: 0 0 10px #10B981;
    }
    
    /* SELETOR DE GRUPOS (PRINT 4) */
    .select-box {
      margin-bottom: 12px;
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .select-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94A3B8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .select-row {
      display: flex;
      gap: 6px;
    }
    .group-dropdown {
      flex: 1;
      background: #1E293B;
      color: #F8FAFC;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .group-dropdown:focus {
      border-color: #10B981;
    }
    .btn-icon {
      background: #1E293B;
      color: #94A3B8;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0 10px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-icon:hover {
      background: #334155;
      color: white;
    }

    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, #10B981, #047857);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .btn-main:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }
    .result-box {
      margin-top: 12px;
      background: #111827;
      border: 1px solid #1E293B;
      border-radius: 12px;
      padding: 12px;
      display: none;
    }
    .result-stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .stat-num {
      font-size: 22px;
      font-weight: 900;
      color: #10B981;
    }
    .stat-label {
      font-size: 10px;
      color: #94A3B8;
      text-transform: uppercase;
      font-weight: 700;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-sec {
      background: #1E293B;
      color: #F8FAFC;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: 0.2s;
    }
    .btn-sec:hover { background: #334155; }
    .btn-crm {
      grid-column: span 2;
      background: linear-gradient(135deg, #8B5CF6, #6D28D9);
      color: white;
      border: none;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }
    .btn-crm:hover { filter: brightness(1.1); }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #64748B;
      border-top: 1px solid #1E293B;
      padding-top: 8px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #1E293B;
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
      display: none;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10B981, #38BDF8);
      transition: width 0.3s;
    }
    .msg-feedback {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      color: #38BDF8;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-box">
      <span class="logo-badge">RESET</span>
      <div>
        <div class="title">Extrator WhatsApp</div>
        <div class="subtitle">Silicon Valley CRM Edition</div>
      </div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <div id="dot-status" class="dot"></div>
      <span id="txt-status">Verificando WhatsApp Web...</span>
    </div>
  </div>

  <!-- SELETOR DINÂMICO DE GRUPOS E CONVERSAS (PRINT 4) -->
  <div class="select-box">
    <label class="select-label">📁 Escolha o Grupo ou Conversa:</label>
    <div class="select-row">
      <select id="select-grupos-whatsapp" class="group-dropdown">
        <option value="__ATUAL__">⚡ Conversa aberta na tela</option>
      </select>
      <button id="btn-recarregar-grupos" class="btn-icon" title="Buscar todos os grupos da barra lateral">🔄</button>
    </div>
  </div>

  <button id="btn-extrair" class="btn-main" disabled>
    <span>⚡ Extrair Todos os Contatos</span>
  </button>

  <div id="progress" class="progress-bar">
    <div id="progress-fill" class="progress-fill"></div>
  </div>
  <div id="msg-feedback" class="msg-feedback"></div>

  <div id="result-box" class="result-box">
    <div class="result-stats">
      <div>
        <div id="total-extraidos" class="stat-num">0</div>
        <div class="stat-label">Total Extraídos</div>
      </div>
      <div style="text-align: right;">
        <div id="total-com-tel" class="stat-num" style="color: #38BDF8;">0</div>
        <div class="stat-label">Telefones Válidos</div>
      </div>
    </div>

    <div class="btn-group">
      <button id="btn-enviar-crm" class="btn-sec btn-crm">
        🚀 Sincronizar com Meu Kanban do Litrão
      </button>
      <button id="btn-baixar-json" class="btn-sec">
        📥 Baixar JSON
      </button>
      <button id="btn-baixar-csv" class="btn-sec">
        📄 Baixar Planilha
      </button>
      <button id="btn-copiar" class="btn-sec" style="grid-column: span 2;">
        📋 Copiar Lista Pronta para o Kanban
      </button>
    </div>
  </div>

  <div class="footer">
    Plataforma Litrão do Reset • SuperAdmin Silicon Valley
  </div>

  <script src="popup.js"></script>
</body>
</html>
