<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Super Admin - Litrão do Reset SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#1a361d',
                        'brand-green': '#204624',
                        'brand-light': '#82b434',
                        'brand-yellow': '#ffa700',
                    },
                    fontFamily: { sans: ['Montserrat', 'sans-serif'], }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-gray-100">

    <!-- Sidebar Lateral -->
    <aside class="w-64 bg-brand-dark text-white flex flex-col hidden md:flex">
        <div class="h-20 flex items-center justify-center border-b border-white/10 px-6">
            <h1 class="text-2xl font-extrabold italic tracking-tighter">RESET<span class="text-brand-yellow text-sm block not-italic font-bold tracking-widest mt-0">SAAS ADMIN</span></h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="flex items-center px-4 py-3 bg-brand-green/50 text-brand-yellow rounded-lg font-semibold transition">
                <i class="fa-solid fa-users mr-3"></i> Supervisores
            </a>
        </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-8 z-10">
            <div class="flex items-center text-xl font-bold text-gray-800">
                <i class="fa-solid fa-users text-brand-light mr-3"></i> Gestão de Assinaturas
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right hidden md:block">
                    <p class="text-sm font-bold text-gray-800">Administrador</p>
                    <p class="text-xs text-gray-500">Acesso Total</p>
                </div>
                <div class="w-10 h-10 bg-brand-yellow rounded-full flex items-center justify-center text-white font-bold text-lg">A</div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-1">Total Ativos</p>
                        <h3 id="total-ativos" class="text-3xl font-black text-brand-dark">0</h3>
                    </div>
                    <div class="w-14 h-14 bg-green-50 text-brand-light rounded-full flex items-center justify-center text-2xl">
                        <i class="fa-solid fa-check-circle"></i>
                    </div>
                </div>
            </div>

            <!-- Tabela e Controles -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 border-b border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="relative w-full md:w-96">
                        <i class="fa-solid fa-search absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="text" placeholder="Buscar supervisor..." class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-light transition">
                    </div>
                    <button onclick="abrirModal()" class="w-full md:w-auto bg-brand-light hover:bg-green-600 text-white font-bold py-3 px-6 rounded-xl transition shadow-md flex items-center justify-center">
                        <i class="fa-solid fa-plus mr-2"></i> Novo Supervisor
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-sm uppercase tracking-wider">
                                <th class="p-4 font-semibold">Consultor / Espaço</th>
                                <th class="p-4 font-semibold">Link Personalizado</th>
                                <th class="p-4 font-semibold">WhatsApp</th>
                                <th class="p-4 font-semibold text-center">Status / Vencimento</th>
                                <th class="p-4 font-semibold text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo" class="text-gray-700">
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Modal Editar Status / Vencimento -->
    <div id="modal-editar" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 w-full max-w-sm shadow-2xl">
            <h2 class="text-xl font-bold mb-6 text-brand-dark flex items-center">
                <i class="fa-solid fa-clock-rotate-left mr-3 text-brand-light"></i>
                Liberar Acesso
            </h2>
            <form id="form-editar" onsubmit="salvarEdicao(event)">
                <input type="hidden" id="edit-id">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Status da Conta</label>
                        <select id="edit-status" class="w-full px-4 py-3 border border-gray-200 bg-gray-50 rounded-xl focus:ring-2 focus:ring-brand-light outline-none font-bold">
                            <option value="Ativo">Ativo (Liberado)</option>
                            <option value="Pendente">Pendente (Bloqueado)</option>
                            <option value="Vencido">Vencido (Bloqueado)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Data de Vencimento</label>
                        <input type="date" id="edit-vencimento" class="w-full px-4 py-3 border border-gray-200 bg-gray-50 rounded-xl focus:ring-2 focus:ring-brand-light outline-none">
                    </div>
                </div>
                <div class="mt-8 flex justify-end gap-3 pt-4 border-t border-gray-100">
                    <button type="button" onclick="fecharModalEditar()" class="px-5 py-3 text-gray-500 font-bold hover:bg-gray-100 rounded-xl transition">Cancelar</button>
                    <button type="submit" class="px-5 py-3 bg-brand-light text-white font-bold rounded-xl hover:bg-green-600 transition shadow-md">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Novo Supervisor (Resumido) -->
    <div id="modal-novo" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-brand-dark flex items-center">
                <i class="fa-solid fa-user-plus mr-3 text-brand-light"></i> Novo Manual
            </h2>
            <form id="form-novo" onsubmit="salvarSupervisor(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Nome do Consultor</label>
                        <input type="text" id="input-nome" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50 rounded-xl">
                    </div>
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-sm font-bold text-gray-700 mb-1">ID Herbalife</label>
                            <input type="text" id="input-id" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50 rounded-xl">
                        </div>
                        <div class="w-24">
                            <label class="block text-sm font-bold text-gray-700 mb-1">Letras</label>
                            <input type="text" id="input-letras" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50 rounded-xl uppercase text-center font-bold">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">WhatsApp</label>
                        <input type="text" id="input-zap" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50 rounded-xl">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Data de Vencimento</label>
                        <input type="date" id="input-venc" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50 rounded-xl">
                    </div>
                </div>
                <div class="mt-8 flex justify-end gap-3 pt-4 border-t border-gray-100">
                    <button type="button" onclick="fecharModal()" class="px-5 py-3 text-gray-500 font-bold hover:bg-gray-100 rounded-xl">Cancelar</button>
                    <button type="submit" class="px-5 py-3 bg-brand-light text-white font-bold rounded-xl hover:bg-green-600 shadow-md">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://ufgcjzhecpmhsavppjyn.supabase.co';
        const supabaseKey = 'sb_publishable_kAMJXskqnvsFfBVw5vPNOw_9RVAAOYX';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        const tableBody = document.getElementById('tabela-corpo');

        function formatarData(dataISO) {
            if(!dataISO) return 'Sem data';
            const partes = dataISO.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        async function carregarDados() {
            tableBody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Carregando...</td></tr>';
            
            const { data, error } = await supabaseClient.from('consultores').select('*').order('id', { ascending: false });
            
            if (error) return tableBody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-red-500 font-bold">Erro ao conectar.</td></tr>';
            
            let ativosCount = 0;
            tableBody.innerHTML = '';
            
            if(data.length === 0) return tableBody.innerHTML = '<tr><td colspan="5" class="text-center p-8">Nenhum cadastrado.</td></tr>';

            data.forEach(item => {
                const isAtivo = (item.status || '').toLowerCase() === 'ativo';
                if(isAtivo) ativosCount++;

                let statusColor = isAtivo ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
                
                tableBody.innerHTML += `
                    <tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                        <td class="p-4">
                            <p class="font-bold text-gray-900">${item.nome_espaco || 'Sem nome'}</p>
                            <p class="text-xs text-gray-500">ID: ${item.herbalife_id} ${item.letras ? item.letras.toUpperCase() : ''}</p>
                        </td>
                        <td class="p-4">
                            <a href="/${item.slug}" target="_blank" class="text-blue-500 hover:underline font-medium text-sm flex items-center">
                                /${item.slug} <i class="fa-solid fa-arrow-up-right-from-square ml-2 text-[10px]"></i>
                            </a>
                        </td>
                        <td class="p-4 text-sm font-medium"><a href="https://wa.me/${item.whatsapp}" target="_blank" class="text-green-600 hover:underline"><i class="fa-brands fa-whatsapp"></i> ${item.whatsapp}</a></td>
                        <td class="p-4 text-center">
                            <span class="${statusColor} px-3 py-1 rounded-full text-xs font-bold uppercase mb-1 inline-block">${item.status || 'Ativo'}</span>
                            <div class="text-[11px] font-bold text-gray-500"><i class="fa-regular fa-calendar mr-1"></i> ${formatarData(item.vencimento)}</div>
                        </td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="abrirModalEditar('${item.id}', '${item.status || 'Ativo'}', '${item.vencimento || ''}')" class="text-blue-500 hover:bg-blue-50 transition bg-white border border-blue-200 p-2 rounded-lg font-bold text-xs shadow-sm">
                                <i class="fa-solid fa-pen-to-square"></i> Liberar/Editar
                            </button>
                            <button onclick="deletar('${item.id}')" class="text-gray-400 hover:text-red-500 transition p-2 rounded-lg">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('total-ativos').innerText = ativosCount;
        }

        // EDICAO
        function abrirModalEditar(id, status, venc) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-status').value = status.charAt(0).toUpperCase() + status.slice(1).toLowerCase();
            document.getElementById('edit-vencimento').value = venc;
            document.getElementById('modal-editar').classList.remove('hidden');
        }
        function fecharModalEditar() { document.getElementById('modal-editar').classList.add('hidden'); }

        async function salvarEdicao(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const st = document.getElementById('edit-status').value;
            const dt = document.getElementById('edit-vencimento').value;
            
            await supabaseClient.from('consultores').update({ status: st, vencimento: dt }).eq('id', id);
            fecharModalEditar();
            carregarDados();
        }

        // NOVO
        function abrirModal() { document.getElementById('modal-novo').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modal-novo').classList.add('hidden'); document.getElementById('form-novo').reset(); }

        async function salvarSupervisor(e) {
            e.preventDefault(); 
            const nome = document.getElementById('input-nome').value;
            const hId = document.getElementById('input-id').value;
            const letras = document.getElementById('input-letras').value.toUpperCase();
            const zap = document.getElementById('input-zap').value.replace(/\D/g, '');
            const venc = document.getElementById('input-venc').value;
            const slug = hId + letras.toLowerCase();

            const { error } = await supabaseClient.from('consultores').insert([{
                slug: slug, herbalife_id: hId, letras: letras, whatsapp: zap, nome_espaco: nome, status: 'Ativo', vencimento: venc
            }]);

            if (error) alert("Erro! Link já existe.");
            else { fecharModal(); carregarDados(); }
        }

        async function deletar(id) {
            if(confirm("Deseja excluir? O link sairá do ar!")) {
                await supabaseClient.from('consultores').delete().eq('id', id);
                carregarDados();
            }
        }

        document.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
